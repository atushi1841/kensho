    - label: "WiFi-D (@TankanNotes)"
      type: wifi_monitor
      wifi_profile: "8_iP6s"

# ── レート制限（X BAN回避）──
# 1垢あたりの日次上限。SocialNexis 2026年推奨値に準拠。
# 新規アカウント（30日未満）はさらに30%減で運用。
# 各バッチで上限に達したらその垢はその日は停止。
rate_limits:
  max_follow_per_day: 100           # 120→100（フォローが最も危険、少し抑える）
  max_rt_per_day: 80                # そのまま
  max_like_per_day: 250            # 200→250（いいねは安全、増やす）
  max_reply_per_day: 10
  max_actions_per_hour: 15         # 30→15（アイテム数基準、15件×3=45アクション/時に分散）
  active_hours_start: "08:00"
  active_hours_end: "23:00"
  min_delay_between_actions: 20   # 12→20（基本間隔を拡大）
  max_delay_between_actions: 60   # 45→60
  extra_long_pause_chance: 0.25   # 0.20→0.25（長休憩確率up）
  break_after_n_items: 5          # 3→5（休憩頻度は減らすが、休憩時間を長く）
  break_min_seconds: 45           # 30→45
  break_max_seconds: 120          # 90→120
  memory_reserve_mb: 2048

# ── PolicyEngine（アクション実行前ポリシー評価）──
# AEE (Agent-Execution-Partnership) 由来のポリシー評価設定
# PolicyEngineで各アクション前にチェック: 日次上限→時間あたり上限→最低間隔→確率スキップ→アクティブ時間
# 注意: 日次上限の実制御は rate_limits 配下。PolicyEngineの時間あたり上限は補助的な上乗せレイヤー。
policy_engine:
  # リスククラス別の1時間あたり上限（確実性重視の値）
  hourly_limits:
    like: 20
    follow: 8
    rt: 12
  # アクションごとの確率スキップ率（BOT対策：高リスクほど高確率でスキップ）
  skip_probability:
    like: 0.05
    follow: 0.10
    rt: 0.08
  # リスクウェイト（日次上限 × この倍率 = 事実上の上限）
  risk_weights:
    like: 1.0
    follow: 0.8
    rt: 0.9

# ── Failure Ceiling（連続失敗上限）──
# Loop Engineering: 連続XX回エラーでその垢のバッチを打ち切り、cooldown後に再開
failure_ceiling:
  enabled: true
  max_consecutive_failures: 3      # 3回連続失敗で打ち切り
  cooldown_minutes: 30             # 30分後に自動リセット

# ── アクション検証設定 ──
# Loop Engineering: page.gotoによる重検証（プロフィールに遷移してボタン状態を確認）
# コスト高いのでデフォルトOFF。必要なアクションだけONに推奨。
verification:
  enabled: false                   # false: 軽量チェックのみ（API戻り値）
  verify_follow: false             # true: フォロー後→プロフィール遷移で確認
  verify_rt: false                 # true: RT後→ツイート遷移で確認
  verify_like: false               # true: いいね後→ツイート遷移で確認
  verify_account_health: true      # true: ループ開始前にアカウント健全性チェック

# ── 安全設定 ──
safety:
  ip_separation_check: true        # true: 応募前に各プロキシ経由IPがユニークか確認
  ip_check_timeout: 10             # 各プロキシ接続のタイムアウト(秒)
  cache_ttl_seconds: 300           # チェック結果のキャッシュ時間(秒)。5分（自宅IP変動の早期検出）
  home_internet_accounts:
    - "atushi16"                   # 自宅インターネット回線を使う正規アカウント（他アカウントは個別SOCKS5プロキシ必須）
    # ↓ 凍結済み（削除済み）

# ── オーケストレーター ──
orchestrator:
  interval_minutes: 15
  max_accounts_per_run: 5        # 全垢を毎サイクル処理
  apply_timeout: 1800
  batch_jitter_minutes: 15      # バッチ時刻を±15分ランダム化（BOT対策）
  priority: "pending_first"

# ── NGワード（除外フィルター）──
# この文字列を含むツイートは応募をスキップします
ng_words:
  - "応募フォーム"
  - "クイズ"
  - "URL"
  - "問題"
  - "動画"
  - "LINE"
  - "結果を確認"
  - "画像"
  - "応募はこちら"
  - "引用"
  - "結果確認"
  - "url"
  - "リンク先"
  - "チェック"
  - "合言葉"
  - "アンケート"
  - "抽選結果"
  - "リンク"
  - "シェア"

# ── 必須ワード（応募条件）──
# 「フォロー」を含む投稿のみ応募
required_words:
  require_all: ["フォロー"]
  require_any: []

# ── URLフィルター ──
# true: URL（http/https）を含む投稿は応募しない
skip_url_posts: true

# ── 収集フィルタ ──
collection_filter:
  min_retweet_threshold: 3       # RT数がこれ未満はスキップ（偽懸賞対策）
  min_like_threshold: 1          # いいね数がこれ未満はスキップ
  max_tweet_age_hours: 72        # 3日以上前のツイートは応募しない

# ── 賞品価値推定 ──
prize_scoring:
  enabled: true
  jpy_patterns:
    - "\\d{1,3}(?:,\\d{3})*万円"
    - "\\d{1,3}(?:,\\d{3})*円"
    - "\\d{1,3}(?:,\\d{3})*円相当"
    - "\\d{1,3}(?:,\\d{3})*円分"
  item_patterns:
    - "Amazon.*ギフト券?|ギフト券"
    - "商品券|図書券"
    - "QUOカード|クオカード"
    - "家電|スマホ|タブレット"
    - "旅行|宿泊|温泉"
    - "現金"
    - "Switch|PS5|ゲーム機"
  priority_multipliers:
    "現金": 3.0
    "Amazon.*ギフト券?|ギフト券": 2.5
    "旅行|宿泊": 2.5
    "家電|スマホ|タブレット": 2.0
    "Switch|PS5": 2.0
    "商品券|図書券": 1.5
    "QUOカード|クオカード": 1.2

# ── Telegram通知 ──
telegram:
  enabled: false                 # trueにしてtoken/chat_idを設定
  token: ""                      # BotFatherから取得（例: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"）
  chat_id: ""                    # 通知先チャットID（@userinfobot等で確認）
  notify_on: ["dm_win"]         # 通知イベント: dm_win, error, daily_report
