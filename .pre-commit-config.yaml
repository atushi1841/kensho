# ════════════════════════════════════════════
# Kensho Pre-commit Hooks
# Ruff (linter + formatter) + basic checks
# ════════════════════════════════════════════
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        # --exit-non-zero-on-fix は修正時にコミットを中止してしまうため削除
        # （自動修正はワーキングツリーに残る。次の git add で反映される）
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # コミット・プッシュ忘れ防止 (t_c2104009): 未pushコードを自動push、
  # push不能なら commit をブロック（= 重ね積みを防ぎ guard(e) "unpushed code" の FAILを根絶）
  - repo: local
    hooks:
      - id: push-guard
        name: "push-guard: commit/push忘れ防止"
        entry: python3 scripts/push_guard.py --stage pre-commit
        language: system
        pass_filenames: false
        always_run: true

      # t_7060bd39: doneガード遵守率向上。commit前にガード本体の自己検証を実行し、
      # ガード自体が機能しているか（全条件の検出路が生かっているか）を確定する。
      # ワーキングツリーのタスク別判定は pre-commit 時点ではコンテキスト無しのため、
      # ここでは --selftest（隔離一時repoでの回帰検証）で代替。worker の完了前は
      # kanban_done_guard.py <task_id> --task でタスク別判定を行う（SOUL.md 参照）。
      - id: done-guard
        name: "done-guard: 完了前ガード自己検証（commit前必須）"
        entry: python3 /home/atushi/.hermes/profiles/kensho-sweeps/scripts/kanban_done_guard.py --selftest
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            data/.*|
            logs/.*
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            data/.*|
            logs/.*
          )$
      - id: check-yaml
        exclude: ^logs/
      - id: check-json
        exclude: ^data/
      - id: check-added-large-files
        args: [--maxkb=500]
