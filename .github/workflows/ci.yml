# Kensho CI — Ruff Lint + Pytest（ブラウザ依存テストはスキップ）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pre-commit ruff pytest pytest-mock

      - name: Run Ruff Lint
        run: ruff check kensho/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check kensho/ tests/

      - name: Run tests (skip browser-dependent)
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_invisible_playwright.py \
            -k "not browser and not Browser" \
            -v --tb=short
