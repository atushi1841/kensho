[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kensho-sweeps"
version = "3.4"
description = "X(Twitter) 懸賞自動応募システム — Playwright Firefox + マルチアカウント"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kensho-Sweeps"},
]
keywords = ["sweepstakes", "twitter", "automation", "playwright"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "playwright>=1.52,<1.53",
    "httpx>=0.27,<0.29",
    "pyyaml>=6.0,<7.0",
    "psutil>=5.9,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*", "core*", "keepalive*", "scraping*", "utils*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
