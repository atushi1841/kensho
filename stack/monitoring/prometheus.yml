# Prometheus設定 (2026-09-01)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ホストメトリクス (CPU/RAM/ディスク)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'N100-wsl'

  # コンテナメトリクス
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'N100-wsl'
