[project]
name = "kensho-sweep-mcp"
version = "1.0.0"
description = "Read-only MCP server exposing Japan X/Twitter sweepstakes campaign data from kensho dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kensho Project" }
]
dependencies = [
    "fastmcp>=3.0.0",
]

[project.scripts]
kensho-sweep-mcp = "src.stdio_main:main"

[tool.uv]
package = false
