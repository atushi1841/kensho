# ════════════════════════════════════════════
# Kensho 全体設定 v3.1
# ════════════════════════════════════════════

general:
  project_dir: "D:\\Project2\\kensho"
  python: "C:\\Users\\1F\\AppData\\Local\\hermes\\hermes-agent\\venv\\Scripts\\python.exe"
  log_retention_days: 30
  session_warn_days: 14

# ── 通知設定 ──
notify:
  discord_webhook: ""
  windows_toast: true

# ── Xアカウント ──
# 垢を追加するときはここに追記し、python recreate_tasks.py を実行する
accounts:
  - key: atushi16
    display: "@atushi16"
    session: "data/x_session.json"
    network_interface: "イーサネット"
    disable_reply: true
    schedule:
      collects: true
      batches:
        - { time: "09:21", max: 15 }
        - { time: "11:05", max: 15 }
        - { time: "13:33", max: 15 }
        - { time: "16:15", max: 15 }
        - { time: "19:47", max: 15 }

  - key: kudou
    display: "@kudou_aoshi"
    session: "data/x_session_kudou.json"
    network_interface: "kudou_RM10JE_B"
    disable_reply: true
    schedule:
      collects: false
      batches:
        - { time: "10:05", max: 10 }
        - { time: "12:13", max: 10 }
        - { time: "15:28", max: 10 }
        - { time: "17:47", max: 10 }
        - { time: "20:14", max: 10 }

  - key: atushi1840
    display: "@atushi1840"
    session: "data/x_session_b.json"
    network_interface: "Atushi1840_RM10JE_S"
    disable_reply: true
    schedule:
      collects: false
      batches:
        - { time: "11:17", max: 10 }
        - { time: "13:42", max: 10 }
        - { time: "16:42", max: 10 }
        - { time: "18:23", max: 10 }
        - { time: "21:08", max: 10 }

  - key: zin20120731
    display: "@zin20120731"
    session: "data/x_session_c.json"
    network_interface: "zin_AiRWiFi"
    disable_reply: true
    schedule:
      collects: false
      batches:
        - { time: "10:45", max: 10 }
        - { time: "13:00", max: 10 }
        - { time: "16:00", max: 10 }
        - { time: "18:00", max: 10 }
        - { time: "20:30", max: 10 }

# ── 収集設定 ──
collection:
  source: "https://knshow.com"
  times: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"]
  max_items: 500

# ── Keepalive ──
keepalive:
  interval_minutes: 5
  interfaces:
    - label: "USB-B (povo/@atushi1840)"
      type: ping
      network_interface: "Atushi1840_RM10JE_S"
    - label: "WiFi-A (@kudou_aoshi)"
      type: wifi_monitor
      network_interface: "kudou_RM10JE_B"
      wifi_profile: "a"
    - label: "WiFi-C (@zin20120731)"
      type: wifi_monitor
      network_interface: "zin_AiRWiFi"
      wifi_profile: "AiR-WiFi_B8W38T_ino"

# ── レート制限（X BAN回避）──
# 1垢あたりの日次上限。SocialNexis 2026年推奨値に準拠。
# 新規アカウント（30日未満）はさらに30%減で運用。
# 各バッチで上限に達したらその垢はその日は停止。
rate_limits:
  max_follow_per_day: 50           # 推奨30-50（旧120→危険）
  max_rt_per_day: 15               # 推奨10-20（旧80→危険）
  max_like_per_day: 80             # 推奨50-100（旧200→危険）
  max_reply_per_day: 10            # そのまま
  max_actions_per_hour: 15         # 推奨15/時（新規追加）
  active_hours_start: "09:00"     # この時間以降のみ動作
  active_hours_end: "23:59"       # 深夜は避ける（BOT判定対象）
  min_delay_between_actions: 15   # 基本最小間隔（秒）少し長めに
  max_delay_between_actions: 50   # 基本最大間隔（秒）少し長めに
  extra_long_pause_chance: 0.15   # 15%の確率で60-120秒の長休憩（増加）
  break_after_n_items: 2          # 2件ごとに長め休憩（短縮）
  break_min_seconds: 45           # 休憩最小（少し長め）
  break_max_seconds: 120          # 休憩最大（少し長め）

# ── オーケストレーター ──
orchestrator:
  interval_minutes: 15
  max_accounts_per_run: 2        # 2垢ずつ処理（4垢を回すのに必要）
  apply_timeout: 1800
  priority: "pending_first"
