# Smithery.ai configuration for kensho-kaku MCP
description: "Japan sweepstakes data from ken-kaku.com — current sweep, history, and top prize movers. Tools: current_sweep, sweep_history, top_prize_movers."
repositoryUrl: https://github.com/atushi1841/kensho-kaku
iconUrl: https://raw.githubusercontent.com/atushi1841/kensho-kaku/main/icon.png
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |
    (config) => ({
      command: 'python',
      args: ['uv', 'run', '--directory', '${__dirname}', 'src/stdio_main.py']
    })
exampleConfig: {}
