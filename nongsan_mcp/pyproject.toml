[project]
name = "nongsan-mcp"
version = "0.1.0"
description = "Japanese agricultural market data MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
nongsan-mcp = "nongsan_mcp.cli:main"
nongsan-build = "nongsan_mcp.nongsan_mcp:build_data_from_excel"