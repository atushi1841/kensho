[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kensho-sweeps"
version = "3.5.0"
description = "Kensho - 懸賞自動応募システム"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.52",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "keyring>=24.0",
    "requests>=2.31",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.0",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kensho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=kensho --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = false  # 既存コード対応、新規コードは型付け前提

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]  # Allow non-PEP8 naming in tests
"tests/measure_comprehensive.py" = ["E501"]  # Long measurement keys
# ── 既存負債（意図的スタイルとして許容、2026-08-23）──
# E402: guard_stdio()呼び出し後に必要な import、E731: lambda代入（組み込み委譲の既存パターン）
# N806: 大文字の関数内定数（DATA_DIR等）、UP031: %フォーマットの既存記述
"kensho/application/applier.py" = ["E402", "N806", "E731"]
"kensho/application/api_actions.py" = ["UP031"]
"kensho/scraping/collector.py" = ["N806"]
# kensho_hub.py: 埋め込みHTML/CSS生成スクリプト（長い行は改行するとCSS/HTMLが壊れるため E501 許容）
"kensho_hub.py" = ["E501"]

[tool.ruff.format]
preview = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]
