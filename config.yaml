  food_multiplier:
    お菓子|スナック|チョコ|アイス|調味料|食品|ラーメン: 1.4
    飲料|ドリンク|お茶|コーヒー|ビール|ジュース|スイーツ: 1.5
  item_patterns:
  - Amazon.*ギフト券?|ギフト券
  - 商品券|図書券
  - QUOカード|クオカード
  - 家電|スマホ|タブレット
  - 旅行|宿泊|温泉
  - 現金
  - Switch|PS5|ゲーム機
  jpy_patterns:
  - \d{1,3}(?:,\d{3})*万円
  - \d{1,3}(?:,\d{3})*円
  - \d{1,3}(?:,\d{3})*円相当
  - \d{1,3}(?:,\d{3})*円分
  priority_multipliers:
    Amazon.*ギフト券?|ギフト券: 2.5
    QUOカード|クオカード: 1.2
    Switch|PS5: 2.0
    商品券|図書券: 1.5
    家電|スマホ|タブレット: 2.0
    旅行|宿泊: 2.5
    現金: 3.0
  short_deadline:
    multiplier: 1.3
    within_hours: 24
  sponsor_multiplier:
    協賛|タイアップ|提供: 1.7
    地域限定|店舗|店頭|ローカル|ご当地: 1.5
  winner_count_multiplier:
    '100': 1.3
    '2000': 2.0
    '600': 1.6
