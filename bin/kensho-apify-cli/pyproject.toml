[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kensho-apify-cli"
version = "0.1.0"
description = "CLI toolkit for managing and testing Apify actors from the Kensho portfolio (86 Japan market scrapers)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "atushi1841"}]
keywords = ["apify", "scraper", "japan", "price", "market", "cli"]
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
kensho-apify = "kensho_apify_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
