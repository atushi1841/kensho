[mypy]
python_version = 3.11
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = scripts/|data/|logs/|wiki/|__pycache__/|scraping/

# playwrite/httpx/psutil/pyyaml は型スタブなし
[mypy-playwright.*]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true

[mypy-psutil.*]
ignore_missing_imports = true

[mypy-yaml.*]
ignore_missing_imports = true
